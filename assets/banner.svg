<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1423" />
      <stop offset="40%" stop-color="#2d1e3d" />
      <stop offset="80%" stop-color="#3d2645" />
      <stop offset="100%" stop-color="#140f1a" />
    </linearGradient>
    <linearGradient id="heartGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ebb" />
      <stop offset="100%" stop-color="#e0aaff" />
    </linearGradient>
    <linearGradient id="heartGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c77dff" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ff758f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgBanner)"/>
  
  <!-- Subtle Rain Lines -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.15">
    <line x1="120" y1="40" x2="100" y2="160" />
    <line x1="280" y1="80" x2="260" y2="220" />
    <line x1="450" y1="20" x2="430" y2="170" />
    <line x1="720" y1="60" x2="700" y2="200" />
    <line x1="900" y1="30" x2="880" y2="180" />
    <line x1="1080" y1="70" x2="1060" y2="230" />
    <line x1="200" y1="350" x2="180" y2="520" />
    <line x1="600" y1="400" x2="580" y2="580" />
    <line x1="850" y1="320" x2="830" y2="500" />
  </g>

  <!-- Big Broken Heart in Center -->
  <g transform="translate(600, 220) scale(1.6)" filter="url(#bannerGlow)">
    <!-- Left Half -->
    <path d="M -5, -40 C -35,-80 -95,-45 -95, 0 C -95, 45 -45, 80 -5, 110 L -5, 55 L -20, 38 L -5, 20 L -25, 0 L -5, -40 Z" fill="url(#heartGradL)"/>
    <!-- Right Half -->
    <path d="M 12, -35 L 28, -5 L 8, 16 L 24, 34 L 12, 50 L 12, 110 C 52, 80 102, 45 102, 0 C 102,-45 42,-80 12, -35 Z" fill="url(#heartGradR)"/>
  </g>

  <!-- Tag / Ribbon -->
  <rect x="425" y="65" width="350" height="42" rx="21" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)"/>
  <text x="600" y="92" text-anchor="middle" font-family="'Nunito', sans-serif" font-weight="700" font-size="16" fill="#ffb3c6" letter-spacing="2">🥀 KISAH HATI YANG TERLALU CEPAT SELESAI</text>

  <!-- Big Title: Erlang & Cindy -->
  <text x="600" y="460" text-anchor="middle" font-family="'Dancing Script', cursive, sans-serif" font-weight="700" font-size="64" fill="#ffffff" filter="url(#bannerGlow)">
    Erlang <tspan fill="#ff758f">💔</tspan> Cindy
  </text>

  <!-- Subtitle -->
  <text x="600" y="520" text-anchor="middle" font-family="'Nunito', sans-serif" font-weight="800" font-size="28" fill="#ffd1dc" letter-spacing="1">
    26 NOVEMBER
  </text>
  <text x="600" y="560" text-anchor="middle" font-family="'Nunito', sans-serif" font-weight="400" font-size="20" fill="#c4b5fd">
    "Yang seharusnya hari jadian, kini menjadi hari di mana aku harus belajar merelakan..."
  </text>
</svg>
