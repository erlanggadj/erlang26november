<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSadBoy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3b53" />
      <stop offset="50%" stop-color="#34283c" />
      <stop offset="100%" stop-color="#1f1826" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4252" />
      <stop offset="100%" stop-color="#2e3440" />
    </linearGradient>
    <filter id="shadowBoySad">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <rect width="400" height="400" rx="30" fill="url(#bgSadBoy)"/>
  
  <!-- Subtle falling tears / stars in background -->
  <g fill="#70d6ff" opacity="0.4">
    <circle cx="80" cy="90" r="3" />
    <circle cx="320" cy="140" r="2.5" />
    <circle cx="70" cy="220" r="2" />
    <path d="M 330,80 L 332,86 L 338,88 L 332,90 L 330,96 L 328,90 L 322,88 L 328,86 Z" fill="#e0aaff" />
  </g>

  <!-- Sad Erlang Illustration -->
  <g transform="translate(0, 20)">
    <!-- Hoodie / Shoulders -->
    <path d="M 110 380 C 110 290, 145 260, 200 260 C 255 260, 290 290, 290 380 Z" fill="url(#hoodieGrad)" filter="url(#shadowBoySad)"/>
    <!-- Hoodie strings -->
    <line x1="180" y1="260" x2="175" y2="320" stroke="#d8dee9" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="220" y1="260" x2="225" y2="320" stroke="#d8dee9" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Neck -->
    <rect x="185" y="225" width="30" height="40" rx="6" fill="#fcd7b0" />
    
    <!-- Face -->
    <ellipse cx="200" cy="180" rx="55" ry="60" fill="#fed7aa" filter="url(#shadowBoySad)"/>
    
    <!-- Sad / Teary Eyes -->
    <ellipse cx="174" cy="176" rx="5" ry="7" fill="#2e3440" />
    <circle cx="172" cy="173" r="2" fill="#ffffff" />
    <ellipse cx="226" cy="176" rx="5" ry="7" fill="#2e3440" />
    <circle cx="224" cy="173" r="2" fill="#ffffff" />
    
    <!-- Droplet Tear under left eye -->
    <path d="M 174 186 C 171 190, 171 195, 174 198 C 177 195, 177 190, 174 186 Z" fill="#70d6ff" opacity="0.85"/>
    
    <!-- Sad Eyebrows (slanted inwards) -->
    <path d="M 162 160 Q 174 167 186 163" stroke="#2e3440" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 214 163 Q 226 167 238 160" stroke="#2e3440" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    
    <!-- Sad small pout mouth -->
    <path d="M 190 206 Q 200 198 210 206" stroke="#c9184a" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Hair (messy emo / aesthetic parted bangs) -->
    <path d="M 140 165 C 135 120, 160 95, 200 95 C 245 95, 265 120, 260 165 C 255 130, 235 115, 200 115 C 165 115, 148 135, 140 165 Z" fill="#2e3440" />
    <path d="M 148 145 C 170 165, 185 160, 205 135 C 185 130, 165 125, 148 145 Z" fill="#434c5e" />
  </g>
  
  <!-- Badge / Text -->
  <rect x="110" y="325" width="180" height="38" rx="19" fill="rgba(30, 20, 40, 0.85)" stroke="#7b2cbf" stroke-width="1.5"/>
  <text x="200" y="349" text-anchor="middle" font-family="'Nunito', sans-serif" font-weight="800" font-size="15" fill="#e0aaff">Erlang (Berharap) 🥀</text>
</svg>
