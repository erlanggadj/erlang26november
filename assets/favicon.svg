<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient (Nature Forest Emerald) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="50%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#081c15" />
    </linearGradient>

    <!-- Crimson Rose Heart Accent -->
    <linearGradient id="heartBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#9d2043" />
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="#74c69d" stroke-width="2.5" opacity="0.6"/>

  <!-- Top Text: ERLANG -->
  <text x="64" y="39" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="1" 
        filter="url(#textShadow)">ERLANG</text>

  <!-- Middle Pill: LOVE ♡ -->
  <g transform="translate(64, 65)">
    <rect x="-38" y="-12" width="76" height="24" rx="12" fill="url(#heartBadgeGrad)" />
    <text x="0" y="5" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="12" 
          font-weight="900" 
          fill="#ffffff" 
          text-anchor="middle" 
          letter-spacing="1.5">LOVE ♡</text>
  </g>

  <!-- Bottom Text: CINDY -->
  <text x="64" y="105" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="1" 
        filter="url(#textShadow)">CINDY</text>
</svg>
